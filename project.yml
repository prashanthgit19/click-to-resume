name: DevSessions

options:
  bundleIdPrefix: com.devsessions
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
  postGenCommand: python3 scripts/fix_capabilities.py

packages:
  DevSessionsCore:
    path: Packages/DevSessionsCore

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    DEVELOPMENT_TEAM: "67Z29VG25Z"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "0.1.0"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: NO

targets:
  DevSessions:
    type: application
    platform: macOS
    attributes:
      SystemCapabilities:
        com.apple.ApplicationGroups:
          enabled: 1
    sources:
      - path: DevSessions
    dependencies:
      - package: DevSessionsCore
        product: DevSessionsCore
      - target: DevSessionsWidget
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_NAME: DevSessions
        PRODUCT_BUNDLE_IDENTIFIER: com.devsessions.app
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        INFOPLIST_FILE: Config/DevSessions-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/DevSessions.entitlements
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"

  DevSessionsWidget:
    type: app-extension
    platform: macOS
    attributes:
      SystemCapabilities:
        com.apple.ApplicationGroups:
          enabled: 1
    sources:
      - path: DevSessionsWidget
    dependencies:
      - package: DevSessionsCore
        product: DevSessionsCore
    settings:
      base:
        PRODUCT_NAME: DevSessionsWidget
        PRODUCT_BUNDLE_IDENTIFIER: com.devsessions.app.widget
        INFOPLIST_FILE: Config/DevSessionsWidget-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/DevSessionsWidget.entitlements
        ENABLE_APP_SANDBOX: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/../../../../Frameworks"

schemes:
  DevSessions:
    build:
      targets:
        DevSessions: all
    run:
      config: Debug
    archive:
      config: Release
