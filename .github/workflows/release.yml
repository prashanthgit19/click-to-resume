name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=$(awk -F'"' '/MARKETING_VERSION/ { print $2; exit }' project.yml)
          if [[ "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match v$VERSION" >&2
            exit 1
          fi

      - name: Install XcodeGen
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: brew install xcodegen

      - name: Verify
        run: make verify

      - name: Build DMG
        run: |
          xcodegen generate
          DEVELOPER_ID_APPLICATION="-" ./scripts/package_release.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DevSessions-dmg
          path: |
            dist/*.dmg
            dist/SHA256SUMS

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; refusing to overwrite." >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" dist/*.dmg dist/SHA256SUMS \
            --title "$GITHUB_REF_NAME" --generate-notes --draft
          gh release edit "$GITHUB_REF_NAME" --draft=false
