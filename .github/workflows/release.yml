name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: brew install xcodegen

      - name: Verify
        run: make verify

      - name: Build DMG
        run: |
          xcodegen generate
          DEVELOPER_ID_APPLICATION="-" ./scripts/package_release.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DevSessions-dmg
          path: |
            dist/*.dmg
            dist/SHA256SUMS

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.dmg dist/SHA256SUMS --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.dmg dist/SHA256SUMS \
              --title "$GITHUB_REF_NAME" --generate-notes
          fi
